name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  BUSTED_VERSION: 2.3.0-1
  LUABITOP_VERSION: 1.0.3-1
  SELENE_VERSION: 0.31.0
  SELENE_SHA256: dac452422747999ec4919bbb8bb52992b66aae533b60022bf005669de8616671

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        run: |
          if [[ ! $GITHUB_REF_NAME =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta)\.(0|[1-9][0-9]*))?$ ]]; then
            echo "invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ $(git cat-file -t "$GITHUB_REF_NAME") != tag ]]; then
            echo "release tags must be annotated" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_REF_NAME}^{commit}" origin/main; then
            echo "release commit is not on main" >&2
            exit 1
          fi

      - name: Set up Lua
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: 5.1.5

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0
        with:
          luaRocksVersion: 3.13.0

      - name: Install Lua test tools
        run: |
          luarocks install busted "$BUSTED_VERSION"
          luarocks install luabitop "$LUABITOP_VERSION"

      - name: Set up StyLua
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ github.token }}
          version: 2.5.2
          args: false

      - name: Install Selene
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-${SELENE_VERSION}-linux.zip" \
            --output "$RUNNER_TEMP/selene.zip"
          echo "$SELENE_SHA256  $RUNNER_TEMP/selene.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/selene.zip" -d "$RUNNER_TEMP/selene"
          chmod +x "$RUNNER_TEMP/selene/selene"
          echo "$RUNNER_TEMP/selene" >> "$GITHUB_PATH"

      - name: Run checks
        run: make check

      - name: Build package without publishing
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
        with:
          args: -d
          pandoc: false

  full-perft:
    name: Full perft
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        start: [1, 5]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Lua
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: 5.1.5

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0
        with:
          luaRocksVersion: 3.13.0

      - name: Install Lua test tools
        run: |
          luarocks install busted "$BUSTED_VERSION"
          luarocks install luabitop "$LUABITOP_VERSION"

      - name: Run full perft shard group
        run: make perft-parallel DEPTH=6 JOBS=4 START=${{ matrix.start }} SHARDS=8

  publish:
    name: Publish
    needs:
      - preflight
      - full-perft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Package and publish
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
        with:
          pandoc: false
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
